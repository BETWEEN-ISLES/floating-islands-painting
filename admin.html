<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17354c"><title>浮島之間｜展場後台</title><style>
:root{--ink:#17354c;--muted:#70879a;--line:#d8e1df;--coral:#ee765f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff 0 8%,transparent 30%),linear-gradient(135deg,#eaf7f5,#f6f0e4)}button,input{font:inherit}.shell{width:min(920px,calc(100% - 32px));margin:auto;padding:38px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-family:serif;font-weight:900;letter-spacing:.12em;font-size:20px}.back{color:var(--ink);text-decoration:none;font-size:13px;border-bottom:1px solid}.eyebrow{font-size:11px;letter-spacing:.24em;color:#71a291;font-weight:800}.hero h1{font-family:serif;font-size:clamp(38px,7vw,70px);margin:8px 0 10px}.hero h1 em{color:var(--coral);font-style:normal}.hero p{color:var(--muted);line-height:1.8}.panel{margin-top:28px;background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:26px;padding:24px;box-shadow:0 22px 60px rgba(56,91,105,.13)}.lock{display:flex;gap:12px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}label{display:block;flex:1;font-size:12px;font-weight:700}input{display:block;width:100%;margin-top:8px;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px;letter-spacing:.2em}.unlock{height:48px;border:0;border-radius:12px;padding:0 24px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.status div{background:#f5faf8;border-radius:16px;padding:16px}.status small,.status strong{display:block}.status small{font-size:10px;color:var(--muted);margin-bottom:7px}.status strong{font-size:18px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--line);border-radius:18px;padding:19px}.card h2{font-size:16px;margin:0 0 7px}.card p{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 16px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.themes button,.clear{height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:800}.themes button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.clear{width:100%;background:#fff1ee;color:#b94f43;border-color:#f3c1b8}.clear.confirm{background:#c94f43;color:#fff}.controls button:disabled{opacity:.45;cursor:not-allowed}.message{min-height:24px;margin-top:18px;font-size:13px;font-weight:700;color:#4b8f78}.message.error{color:#bd5248}@media(max-width:680px){.shell{padding-top:24px}.panel{padding:16px}.lock{align-items:stretch;flex-direction:column}.controls,.status{grid-template-columns:1fr}.themes{grid-template-columns:1fr}.unlock{width:100%}}
</style></head><body><main class="shell"><header class="top"><div class="brand">◌ 浮島之間</div><a class="back" href="projection.html" target="_blank">開啟投影幕 ↗</a></header><section class="hero"><div class="eyebrow">EXHIBITION CONTROL</div><h1>展場<em>後台</em></h1><p>管理投影幕上的作品與天空背景。所有變更會在數秒內同步到投影幕。</p></section><section class="panel"><div class="lock"><label>管理密碼<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="請輸入密碼"></label><button id="unlock" class="unlock">解鎖控制</button></div><div class="status"><div><small>連線狀態</small><strong id="connection">連線中</strong></div><div><small>天空居民</small><strong id="count">—</strong></div><div><small>目前背景</small><strong id="themeLabel">—</strong></div></div><div class="controls"><article class="card"><h2>更換投影背景</h2><p>選擇自動可維持每 24 小時日夜輪替；也可以固定為白天或夜晚。</p><div class="themes"><button data-theme="auto" disabled>自動輪替</button><button data-theme="day" disabled>固定白天</button><button data-theme="night" disabled>固定夜晚</button></div></article><article class="card"><h2>清除投影幕</h2><p>會永久移除目前所有觀眾作品，投影幕會立刻回到等待新作品的畫面。</p><button id="clear" class="clear" disabled>清除全部作品</button></article></div><div id="message" class="message" role="status" aria-live="polite"></div></section></main><script>
const API_BASE=location.hostname==='floating-islands-painting-1027.quirkygrove133.chatgpt.site'?'':'https://floating-islands-painting-1027.quirkygrove133.chatgpt.site';let unlocked=false,confirming=false;const pin=document.querySelector('#pin'),message=document.querySelector('#message'),clearBtn=document.querySelector('#clear');function say(text,error){message.textContent=text;message.classList.toggle('error',!!error)}function labelTheme(theme){return theme==='day'?'固定白天':theme==='night'?'固定夜晚':'自動輪替'}function setUnlocked(value){unlocked=value;document.querySelectorAll('[data-theme],#clear').forEach(function(button){button.disabled=!value});document.querySelector('#unlock').textContent=value?'已解鎖':'解鎖控制'}function renderState(state){document.querySelector('#connection').textContent='已連線';document.querySelector('#count').textContent=String(state.total||0)+' 位';const theme=state.theme||'auto';document.querySelector('#themeLabel').textContent=labelTheme(theme);document.querySelectorAll('[data-theme]').forEach(function(button){button.classList.toggle('active',button.dataset.theme===theme)})}async function refresh(){try{const response=await fetch(API_BASE+'/api/state',{cache:'no-store'});if(!response.ok)throw new Error();renderState(await response.json())}catch(error){document.querySelector('#connection').textContent='連線失敗';say('目前無法連接投影系統，請檢查網路。',true)}}async function command(body){const response=await fetch(API_BASE+'/api/admin',{method:'POST',headers:{'content-type':'application/json','x-admin-pin':pin.value.trim()},body:JSON.stringify(body)});if(response.status===401){setUnlocked(false);throw new Error('管理密碼不正確')}if(!response.ok)throw new Error('操作失敗，請稍後再試');const data=await response.json();renderState(data);return data}document.querySelector('#unlock').onclick=async function(){if(!pin.value.trim()){say('請先輸入管理密碼。',true);return}try{await command({action:'status'});setUnlocked(true);say('後台已解鎖，可以控制投影幕。')}catch(error){say(error.message,true)}};document.querySelectorAll('[data-theme]').forEach(function(button){button.onclick=async function(){try{await command({action:'theme',theme:button.dataset.theme});say('背景已切換為「'+labelTheme(button.dataset.theme)+'」。')}catch(error){say(error.message,true)}}});clearBtn.onclick=async function(){if(!confirming){confirming=true;clearBtn.textContent='再按一次，確認全部清除';clearBtn.classList.add('confirm');say('此操作無法復原，請再次按下紅色按鈕確認。',true);setTimeout(function(){confirming=false;clearBtn.textContent='清除全部作品';clearBtn.classList.remove('confirm')},5000);return}confirming=false;try{const data=await command({action:'clear'});clearBtn.textContent='清除全部作品';clearBtn.classList.remove('confirm');say('已清除 '+String(data.deleted||0)+' 件作品，投影幕已重設。')}catch(error){say(error.message,true)}};pin.addEventListener('keydown',function(event){if(event.key==='Enter')document.querySelector('#unlock').click()});refresh();setInterval(refresh,5000);
</script></body></html>
