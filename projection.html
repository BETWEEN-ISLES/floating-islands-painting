<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8fd5ed"><title>浮島之間｜共創投影幕</title><link rel="stylesheet" href="styles.css"></head>
<body class="projection-page"><main class="sky" id="sky"><div class="sun"></div><div class="grain"></div><div class="ambient-cloud cloud-one"></div><div class="ambient-cloud cloud-two"></div><div class="ambient-cloud cloud-three"></div>
<header class="projection-header"><div class="projection-brand"><span>◌</span> 浮島之間</div><div class="live-pill"><i></i> 天空共創中</div><button id="fullscreenBtn" class="fullscreen-button">全螢幕 <span>⛶</span></button></header>
<section class="sky-copy"><p>THE SKY WE MAKE TOGETHER</p><h1>每一道色彩，<br>都在天空相遇。</h1></section>
<div class="island island-back"><div class="land"></div><div class="rock"></div></div><div class="island island-main"><div class="windmill"><b></b><i></i></div><div class="tree t1"></div><div class="tree t2"></div><div class="land"></div><div class="rock"></div><span class="waterfall"></span></div><div class="island island-small"><div class="tree t3"></div><div class="land"></div><div class="rock"></div></div>
<div id="flyers" class="flyers" aria-live="polite"></div><div class="waiting-card" id="waitingCard"><span>✦</span><p><strong>天空正在等待新朋友</strong><small>在平板完成作品後，牠就會從雲裡飛出來</small></p></div><footer class="projection-footer"><span><b id="residentCount">0</b> 位天空居民</span><span class="divider"></span><span>一起創造這片天空</span></footer>
</main><script src="projection.js"></script></body></html>
