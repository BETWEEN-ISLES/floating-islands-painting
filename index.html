<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e8f7f6"><title>浮島之間｜畫一位天空居民</title><link rel="stylesheet" href="styles.css"></head>
<body class="studio-page">
<header class="topbar"><a class="brand" href="./"><span class="brand-mark">◌</span><span>浮島之間</span></a><div class="step-pill"><span>01</span> 創造天空居民</div><a class="projection-link" href="projection.html" target="_blank">開啟投影幕 <span>↗</span></a></header>
<main class="studio-shell">
<section class="intro-panel"><p class="eyebrow">COLLABORATIVE SKY</p><h1>畫一位<br><em>天空居民</em></h1><p class="lede">這是一張自由的空白畫布，用顏色畫出你想送進天空的任何模樣。</p>
<div class="hint-card"><span class="hint-icon">✦</span><p><strong>給創作者的小提示</strong><br>先選擇顏色與筆觸，再用手指直接在空白畫布上創作。</p></div></section>
<section class="canvas-panel"><div class="canvas-heading"><div><span class="status-dot"></span> 畫布已準備好</div><button id="clearBtn" class="text-button">清除重畫</button></div>
<div class="canvas-stage"><canvas id="drawCanvas" width="720" height="720" aria-label="繪圖畫布"></canvas><div class="canvas-note">用手指或畫筆，自由畫出你的天空居民</div></div>
<div class="tool-dock"><div><span class="tool-label">畫筆顏色</span><div class="palette" id="palette"></div></div><div><span class="tool-label">筆觸</span><div class="segmented" id="sizes"><button data-size="12" aria-label="細筆"><i class="dot small"></i></button><button data-size="24" class="active" aria-label="中筆"><i class="dot medium"></i></button><button data-size="42" aria-label="粗筆"><i class="dot large"></i></button></div></div><button id="eraserBtn" class="eraser-button" aria-pressed="false"><span>⌁</span> 橡皮擦</button></div>
<div class="action-row"><p><span>02</span> 完成後，送牠飛進大家的天空</p><button id="flyBtn" class="fly-button"><span>讓牠起飛</span><b>➜</b></button></div></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"><span>✓</span><div><strong>準備起飛！</strong><small>到投影幕找找你的作品吧</small></div></div><script src="painter.js"></script></body></html>
